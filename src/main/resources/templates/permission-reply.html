<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Permission Status</title>
</head>
<body style="margin:0;padding:40px 16px;background:#f1f5f9;font-family:'Segoe UI',Arial,sans-serif;">
  <div style="max-width:480px;margin:auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;">

    <div th:style="${action == 'APPROVED'}
        ? 'padding:28px 24px 22px;text-align:center;background:#f0fdf4;border-bottom:1px solid #bbf7d0;'
        : 'padding:28px 24px 22px;text-align:center;background:#fef2f2;border-bottom:1px solid #fecaca;'">
      <div th:style="${action == 'APPROVED'}
          ? 'width:52px;height:52px;border-radius:14px;background:#dcfce7;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:26px;'
          : 'width:52px;height:52px;border-radius:14px;background:#fee2e2;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:26px;'">
        <span th:text="${action == 'APPROVED'} ? '✅' : '❌'"></span>
      </div>
    
    </div>

    <div style="padding:24px;">
<!-- Replace existing employee box with this -->
	<div style="display:flex;align-items:center;gap:14px;padding:16px 18px;background:#f8fafc;border-radius:10px;margin-bottom:28px;border:1px solid #e2e8f0;">
	  <div style="width:44px;height:44px;border-radius:10px;background:#eef2ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;">👤</div>
	  <div>
	    <p style="margin:0;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#94a3b8;font-weight:600;">Employee</p>
	    <p style="margin:3px 0 0;font-size:17px;font-weight:600;color:#0f172a;" th:text="${codeAndName}">—</p>
	    <p style="margin:2px 0 0;font-size:13px;color:#64748b;" th:text="${designation + ' | ' + department}">—</p>
	  </div>
	</div>
      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8fafc;border-radius:10px;margin-bottom:8px;border:1px solid #f1f5f9;">
        <span style="font-size:16px;flex-shrink:0;">📅</span>
        <div>
          <div style="font-size:12px;color:#94a3b8;">Date</div>
          <div style="font-size:13px;font-weight:500;color:#1e293b;" th:text="${date}"></div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8fafc;border-radius:10px;margin-bottom:8px;border:1px solid #f1f5f9;">
        <span style="font-size:16px;flex-shrink:0;">🟢</span>
        <div>
          <div style="font-size:12px;color:#94a3b8;">From Time</div>
          <div style="font-size:13px;font-weight:500;color:#1e293b;" th:text="${fromTime}"></div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8fafc;border-radius:10px;margin-bottom:8px;border:1px solid #f1f5f9;">
        <span style="font-size:16px;flex-shrink:0;">🔴</span>
        <div>
          <div style="font-size:12px;color:#94a3b8;">To Time</div>
          <div style="font-size:13px;font-weight:500;color:#1e293b;" th:text="${toTime}"></div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8fafc;border-radius:10px;margin-bottom:8px;border:1px solid #f1f5f9;">
        <span style="font-size:16px;flex-shrink:0;">📋</span>
        <div>
          <div style="font-size:12px;color:#94a3b8;">Status</div>
          <div>
            <span th:style="${action == 'APPROVED'}
                ? 'display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:#dcfce7;color:#15803d;'
                : 'display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:#fee2e2;color:#dc2626;'"
                  th:text="${action == 'APPROVED'} ? '✓ Approved' : '✗ Rejected'"></span>
          </div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8fafc;border-radius:10px;margin-bottom:8px;border:1px solid #f1f5f9;">
        <span style="font-size:16px;flex-shrink:0;">👤</span>
        <div>
          <div style="font-size:12px;color:#94a3b8;">Actioned by</div>
          <div style="font-size:13px;font-weight:500;color:#1e293b;" th:text="${approvedBy}"></div>
        </div>
      </div>

      <div th:if="${reason != null && reason != ''}"
           style="margin-top:14px;padding:14px;background:#fafafa;border-radius:10px;border:1px solid #f1f5f9;border-left:3px solid #fca5a5;">
        <p style="font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;margin:0 0 6px;">Reason</p>
        <p style="font-size:13px;color:#374151;margin:0;line-height:1.6;" th:text="${reason}"></p>
      </div>

      <div style="margin-top:20px;padding-top:14px;border-top:1px solid #f1f5f9;text-align:center;font-size:12px;color:#94a3b8;">
        This is an automated notification &middot; Please do not reply
      </div>
    </div>
  </div>
</body>
</html>
