<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">

<style>

body{
    background:#f4f6f9;
    font-family:Segoe UI, Arial, sans-serif;
}

.container{
    max-width:650px;
    margin:auto;
    background:#ffffff;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.header{
    text-align:end;
    padding:20px;
    border-bottom:1px solid #eee;
}

.logo{
    width:220px;
}

.content{
    padding:30px;
}

.title{
    color:#2c3e50;
}

.info-box{
    background:#f8f9fa;
    padding:15px;
    border-left:4px solid #27ae60;
    margin:20px 0;
}

.details{
    margin-top:15px;
    line-height:1.8;
}

.footer{
    background:#f4f6f9;
    padding:15px;
    text-align:center;
    font-size:12px;
    color:#888;
}

.button{
    display:inline-block;
    padding:10px 20px;
    background:#3498db;
    color:#ffffff;
    text-decoration:none;
    border-radius:5px;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">
        <img src="cid:companyLogo" class="logo">
    </div>

    <div class="content">

        <p>
            Dear HR Team,
        </p>

        <p>
            The employee listed below has completed the <b>clearance process</b> in the HRMS system.
        </p>

        <div class="info-box">

            <div class="details">
                <b>Employee Name :</b> <span th:text="${employeeName}"></span><br>
                <b>Status :</b> Clearance Submitted<br>
            </div>

        </div>

        <p style="margin-top:25px;">
            Regards <br>
            <b>HRMS System</b><br>
            WhyDigit System Private Limited
        </p>

    </div>

    <div class="footer">
        This is an automated email from HRMS. Please do not reply to this email.
    </div>

</div>

</body>
</html>
