<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Attendance Report</title>
<style>
body{
    margin:0;
    padding:0;
    background:#f4f6f8;
    font-family:Arial,Helvetica,sans-serif;
}
.wrapper{
    width:100%;
    padding:30px 0;
}
.container{
    max-width:900px;
    background:#ffffff;
    margin:auto;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}
.header{
    background:#0d6efd;
    color:#ffffff;
    text-align:center;
    padding:20px;
}
.header h2{
    margin:0;
    font-size:26px;
}
.content{
    padding:25px;
}
.info{
    font-size:14px;
    color:#555;
    margin-bottom:20px;
}
table{
    width:100%;
    border-collapse:collapse;
}
table th{
    background:#0d6efd;
    color:#fff;
    padding:12px;
    text-align:left;
    font-size:14px;
}
table td{
    padding:10px;
    border-bottom:1px solid #e5e5e5;
    font-size:14px;
}
table tr:nth-child(even){
    background:#f9f9f9;
}
.footer{
    padding:20px 25px;
    font-size:13px;
    color:#666;
    background:#fafafa;
}
.highlight{
    color:#0d6efd;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="container">

<div class="header">
<h2>${subject}</h2>
</div>

<div class="content">

<div class="info">
Date :
<span class="highlight">${date}</span>
</div>

<table>

<tr>
<th>S.No</th>
<th>Employee</th>
<th>Code</th>
<th>Check In</th>
${checkoutHeader}
</tr>

${rows}

</table>

</div>

<div class="footer">
Regards,<br>
<b>HRMS Automation System</b>
</div>

</div>

</div>

</body>
</html>
