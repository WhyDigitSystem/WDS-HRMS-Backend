<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title></title>
</head>

<body style="margin:0;padding:0;background:#f4f6f8;font-family:'Times New Roman',Times,serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0"
style="background:#f4f6f8;padding:15px 0;">

<tr>
<td align="center">

<table cellpadding="0" cellspacing="0" border="0"
style="background:#ffffff;border-collapse:collapse;width:auto;max-width:750px;">

<!-- HEADER -->
<tr>
<td style="background:#198754;padding:8px 15px;font-family:'Times New Roman',Times,serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>

<td align="left" style="color:#ffffff;font-size:16px;font-weight:bold;">
${subject}
</td>

<td align="right" style="color:#ffffff;font-size:12px;font-weight:bold;">
${date}
</td>

</tr>
</table>

</td>
</tr>

<!-- CONTENT -->
<tr>
<td style="padding:10px 15px;">

<table cellpadding="0" cellspacing="0" border="1"
style="border-collapse:collapse;border:1px solid #dddddd;font-family:'Times New Roman',Times,serif;width:auto;">
${colgroup}
<tr style="background:#198754;color:#ffffff;">

<th style="padding:5px 6px;border:1px solid #ddd;text-align:left;font-size:13px;">
S.No
</th>

<th style="padding:5px 6px;border:1px solid #ddd;text-align:left;font-size:13px;">
Employee
</th>

<th style="padding:5px 6px;border:1px solid #ddd;text-align:left;font-size:13px;">
Code
</th>

<th style="padding:5px 6px;border:1px solid #ddd;text-align:left;font-size:13px;">
Check In
</th>

${checkoutHeader}

</tr>

${rows}

</table>

</td>
</tr>

<!-- FOOTER -->
<tr>
<td style="padding:10px 15px;
font-size:12px;
color:#666;
background:#fafafa;
font-family:'Times New Roman',Times,serif;">

Regards,<br>
<b>HRMS Automation System</b>

</td>
</tr>

</table>

</td>
</tr>

</table>

</body>
</html>
