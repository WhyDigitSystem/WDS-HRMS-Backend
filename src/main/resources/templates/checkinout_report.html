<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Attendance Report</title>
</head>

<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0"
style="background:#f4f6f8;padding:30px 0;">

<tr>
<td align="center">

<table width="900" cellpadding="0" cellspacing="0" border="0"
style="background:#ffffff;border-collapse:collapse;">

<!-- HEADER -->
<tr>
<td align="center"
style="background:#0d6efd;color:#ffffff;
padding:20px;font-size:26px;font-weight:bold;">

${subject}

</td>
</tr>

<!-- CONTENT -->
<tr>
<td style="padding:25px;">

<div style="font-size:14px;color:#555;margin-bottom:20px;">

Date :
<span style="color:#0d6efd;font-weight:bold;">

${date}

</span>

</div>

<table width="100%" cellpadding="0" cellspacing="0" border="1"
style="border-collapse:collapse;border:1px solid #dddddd;">

<tr style="background:#0d6efd;color:#ffffff;">

<th style="padding:12px;border:1px solid #ddd;text-align:left;">
S.No
</th>

<th style="padding:12px;border:1px solid #ddd;text-align:left;">
Employee
</th>

<th style="padding:12px;border:1px solid #ddd;text-align:left;">
Code
</th>

<th style="padding:12px;border:1px solid #ddd;text-align:left;">
Check In
</th>

${checkoutHeader}

</tr>

${rows}

</table>

</td>
</tr>

<!-- FOOTER -->
<tr>
<td style="padding:20px 25px;
font-size:13px;
color:#666;
background:#fafafa;">

Regards,<br>
<b>HRMS Automation System</b>

</td>
</tr>

</table>

</td>
</tr>

</table>

</body>
</html>
