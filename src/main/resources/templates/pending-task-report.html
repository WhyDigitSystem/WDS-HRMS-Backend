<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0; padding:0; background:#eef1f6; font-family:Arial, Helvetica, sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef1f6; padding:8px 12px;">
<tr>
<td align="center">

<table role="presentation" width="640" cellpadding="0" cellspacing="0" style="max-width:640px; width:100%; background:#ffffff; border-radius:10px; overflow:hidden; box-shadow:0 4px 16px rgba(0,51,160,0.08);">

  <!-- Header -->
  <tr>
    <td style="background:#0033A0; padding:16px 32px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
          <td style="vertical-align:middle;">
            <div style="color:#ffffff; font-size:20px; font-weight:bold; letter-spacing:0.3px;">
              Pending Timesheet Report
            </div>
            <div style="color:#c3d0f0; font-size:13px; margin-top:1px;">
              Daily submission compliance &middot; <span th:text="${#dates.format(#dates.createNow(), 'dd MMM yyyy')}">20 Jul 2026</span>
            </div>
          </td>
          <td align="right" style="vertical-align:middle;">
            <table role="presentation" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:20px;">
              <tr>
                <td style="padding:8px 16px; color:#0033A0; font-size:13px; font-weight:bold; text-align:center;">
                  <span th:text="${employees.size()}">12</span>&nbsp;pending
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Body -->
  <tr>
    <td style="padding:28px 32px 8px 32px;"></td>
  </tr>

  <!-- Table -->
  <tr>
    <td style="padding:0 32px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e3e7f0; border-radius:8px; overflow:hidden;">
        <thead>
          <tr>
            <th style="background:#0033A0; color:#ffffff; font-size:12px; text-transform:uppercase; letter-spacing:0.4px; padding:12px 10px; text-align:left; width:12%;">#</th>
            <th style="background:#0033A0; color:#ffffff; font-size:12px; text-transform:uppercase; letter-spacing:0.4px; padding:12px 10px; text-align:left;">Emp Code</th>
            <th style="background:#0033A0; color:#ffffff; font-size:12px; text-transform:uppercase; letter-spacing:0.4px; padding:12px 10px; text-align:left;">Name</th>
            <th style="background:#0033A0; color:#ffffff; font-size:12px; text-transform:uppercase; letter-spacing:0.4px; padding:12px 10px; text-align:left;">Designation</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="emp,stat : ${employees}"
              th:style="${stat.odd} ? 'background:#f6f8fc;' : 'background:#ffffff;'">
            <td style="padding:11px 10px; font-size:13px; color:#555; border-top:1px solid #eef0f5;" th:text="${stat.count}">1</td>
            <td style="padding:11px 10px; font-size:13px; color:#1a1a1a; font-weight:600; border-top:1px solid #eef0f5;" th:text="${emp.employeeCode}">EMP1023</td>
            <td style="padding:11px 10px; font-size:13px; color:#1a1a1a; border-top:1px solid #eef0f5;" th:text="${emp.employeeName}">Dhinesh Kumar</td>
            <td style="padding:11px 10px; font-size:13px; color:#555; border-top:1px solid #eef0f5;" th:text="${emp.designation}">Software Developer</td>
          </tr>
        </tbody>
      </table>
    </td>
  </tr>

  <!-- Summary strip -->
  <tr>
    <td style="padding:20px 32px 28px 32px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f8fc; border-left:4px solid #0033A0; border-radius:6px;">
        <tr>
          <td style="padding:14px 16px; font-size:14px; color:#1a1a1a;">
            Total Pending Employees:
            <strong style="color:#0033A0;" th:text="${employees.size()}">12</strong>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- Footer -->
  <tr>
    <td style="background:#f6f8fc; padding:18px 32px; text-align:center; border-top:1px solid #e3e7f0;">
      <p style="margin:0; font-size:12px; color:#8a8f9c; line-height:1.6;">
        This is an automated email from HRMS. Please do not reply.<br>
        &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> HRMS
      </p>
    </td>
  </tr>

</table>

</td>
</tr>
</table>

</body>
</html>
